name: "CI/CD: Continuous integration and continuous deployment"

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions: {}

jobs:
  build-check-test-push:
    permissions:
      contents: read
      packages: read
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@b4dfad21325ddeb396df4697194cfee0ba0a50d7  # transitdata-shared-workflows PR #37, until it is released
    secrets: inherit  # zizmor: ignore[secrets-inherit] shared workflow declares no secrets: block
    with:
      checkAndTestOutsideDocker: true
      performRelease: false
      checkAndTestInsideDocker: false
      lintBlocking: true
